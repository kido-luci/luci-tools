name: CI (tools-home)
on:
  pull_request:
    paths: ['tools-home/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools-home
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools-home/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test --if-present
      - run: npm run build --if-present
