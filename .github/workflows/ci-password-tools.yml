name: CI (password-tools)
on:
  pull_request:
    paths: ['password-tools/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: password-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: password-tools/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test --if-present
      - run: npm run build --if-present
