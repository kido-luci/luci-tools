name: CI (qr-tools)
on:
  pull_request:
    paths: ['qr-tools/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qr-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: qr-tools/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build --if-present
