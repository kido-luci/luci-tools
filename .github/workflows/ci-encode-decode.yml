name: CI (encode-decode)
on:
  pull_request:
    paths: ['encode-decode/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encode-decode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: encode-decode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test --if-present
      - run: npm run build --if-present
